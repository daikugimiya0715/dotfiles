[settings]
# terraform は tfenv 形式の `.terraform-version` をディレクトリごとに持つリポジトリがあるため、
# idiomatic version file を尊重する。global の latest を使ったまま古い state を
# うっかり新しい terraform で init/apply してしまう事故を防ぐ。
idiomatic_version_file_enable_tools = ["terraform"]

[tools]
node = "22"
bun = "latest"
pnpm = "8.15.5"
python = "3.12.13"
uv = "latest"
supabase = "latest"
yarn = "latest"
rust = "latest"
tree-sitter = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
"npm:@playwright/cli" = "latest"
buf = "latest"
colima = "latest"
docker-cli = "latest"
docker-compose = "latest"
lima = "latest"
"pipx:dvc" = { version = "latest", uvx_args = "--with dvc-s3 --with botocore[crt]" }
direnv = "latest"
terraform = "latest"
"aqua:docker/buildx" = "latest"
"npm:@fission-ai/openspec" = "latest"
