onboarding = false
[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[theme]
name = "terminal"
auto_switch = false

# lazygit をポップアップ（タイルレイアウトを崩さないモーダル）で開く
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

# 使い捨てターミナル（fish シェル）をポップアップで開く
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "fish"
width = "80%"
height = "80%"
